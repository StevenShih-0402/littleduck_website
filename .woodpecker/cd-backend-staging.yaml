# .woodpecker/cd-backend-staging.yaml
# 後端 CD Staging：推送到 main 時直接建映像、掃描、推送 GHCR、部署 Staging 並冒煙；階段見 docs/cicd.md
#
# 不 depends_on CI：main 的品質由 PR 上的 ci/woodpecker/pr/* 加上 branch protection 保證，push 不重跑 CI。
# GitHub status：ci/woodpecker/push/cd-backend-staging（Production 部署前由 verify-build 檢查）
# 部署用 secret 只開 push／deployment 事件，PR 拿不到；hetzner_host、deploy_ssh_key 另限定 scp／ssh plugin。
# YAML 內的 shell 變數一律寫成 $$VAR，避免被 Woodpecker 的變數替換吃掉。

when:
  - event: push
    branch: main

steps:
  - name: build
    image: docker:27.5.1-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - sh deploy/ci/image-ref.sh > .image-ref
      - ref=$$(cat .image-ref); repo=$${ref%:*}; version=$$(sh deploy/ci/backend-version.sh)
      - docker build -t "$$ref" -t "$$repo:$$version" -t "$$repo:latest" backend
      - echo "映像：$$ref"

  - name: trivy
    image: aquasec/trivy:0.58.1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/cache/woodpecker-trivy:/root/.cache
    commands:
      - trivy image --quiet --severity CRITICAL,HIGH --exit-code 1 --ignorefile backend/.trivyignore "$$(cat .image-ref)"

  - name: push-ghcr
    image: docker:27.5.1-cli
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - ref=$$(cat .image-ref); repo=$${ref%:*}; version=$$(sh deploy/ci/backend-version.sh)
      - echo "$$GHCR_TOKEN" | docker login ghcr.io -u "$$GHCR_USERNAME" --password-stdin
      - if docker push "$$ref" && docker push "$$repo:$$version" && docker push "$$repo:latest"; then rc=0; else rc=1; fi; docker logout ghcr.io; exit $$rc

  - name: bundle
    image: alpine:3.21
    environment:
      API_STAGING_HOST:
        from_secret: api_staging_host
    commands:
      - apk add -q gettext
      - sh deploy/ci/backend-bundle.sh staging

  - name: upload
    image: appleboy/drone-scp:1.6.14
    settings:
      host:
        from_secret: hetzner_host
      username: deploy
      key:
        from_secret: deploy_ssh_key
      source: bundle/*
      target: /opt/littleduck-api-staging
      strip_components: 1

  - name: deploy
    image: appleboy/drone-ssh:1.8.0
    settings:
      host:
        from_secret: hetzner_host
      username: deploy
      key:
        from_secret: deploy_ssh_key
      command_timeout: 5m
      script:
        - sh /opt/littleduck-api-staging/remote-deploy.sh /opt/littleduck-api-staging docker-compose.staging.yml littleduck-api-staging

  - name: smoke
    image: curlimages/curl:8.11.1
    environment:
      API_STAGING_HOST:
        from_secret: api_staging_host
      SMOKE_BASIC_AUTH:
        from_secret: staging_basic_auth
    commands:
      - sh deploy/ci/smoke-backend.sh "https://$$API_STAGING_HOST"

  - name: cleanup
    image: docker:27.5.1-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - ref=$$(cat .image-ref 2>/dev/null) || exit 0; repo=$${ref%:*}; version=$$(sh deploy/ci/backend-version.sh)
      - docker image rm -f "$$ref" "$$repo:$$version" "$$repo:latest" || true
    when:
      - status: [success, failure]
