# .woodpecker/cd-backend-production.yaml
# 後端 CD Production：user 在 Staging 確認後，對 push pipeline 按 Deploy（Target 填 production）時執行；見 docs/cicd.md
#
# 不重建映像：部署 Staging 驗證過的同一個 <version>-<sha>。
# Target 不是 production（例如打錯成 prod）時本 workflow 不會執行，部署不會發生。
# Woodpecker 的 Deploy API 不檢查原 pipeline 是否成功，所以第一步 verify-build 檢查 ci/woodpecker/push/* 全部成功。
# YAML 內的 shell 變數一律寫成 $$VAR，避免被 Woodpecker 的變數替換吃掉。

when:
  - event: deployment
    evaluate: 'CI_PIPELINE_DEPLOY_TARGET == "production"'

steps:
  - name: verify-build
    image: alpine:3.21
    commands:
      - apk add -q curl jq
      - sh deploy/ci/verify-commit-status.sh "${CI_REPO}" "${CI_COMMIT_SHA}"

  - name: bundle
    image: alpine:3.21
    environment:
      API_HOST:
        from_secret: api_host
    commands:
      - apk add -q gettext
      - sh deploy/ci/image-ref.sh > .image-ref
      - sh deploy/ci/backend-bundle.sh production

  - name: upload
    image: appleboy/drone-scp:1.6.14
    settings:
      host:
        from_secret: hetzner_host
      username: deploy
      key:
        from_secret: deploy_ssh_key
      source: bundle/*
      target: /opt/littleduck-api
      strip_components: 1

  - name: deploy
    image: appleboy/drone-ssh:1.8.0
    settings:
      host:
        from_secret: hetzner_host
      username: deploy
      key:
        from_secret: deploy_ssh_key
      command_timeout: 5m
      script:
        - sh /opt/littleduck-api/remote-deploy.sh /opt/littleduck-api docker-compose.prod.yml littleduck-api

  - name: smoke
    image: curlimages/curl:8.11.1
    environment:
      API_HOST:
        from_secret: api_host
    commands:
      - sh deploy/ci/smoke-backend.sh "https://$$API_HOST"
