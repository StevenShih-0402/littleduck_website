# deploy/drone/docker-compose.yml
# Drone CI server 與 Docker runner：部署在 Hetzner CX23 的 /opt/drone，由 mygo 的 Nginx 經 mygo-edge 網路反向代理

# 主機前置（見 docs/deployment-runbook.md「Drone 初次建置」）：
#   - 外部網路 mygo-edge 已存在（mygo_v2_anon 建立）
#   - 同目錄放好 .env（範本為 .env.example）
# server 不對外開埠，只在 mygo-edge 上以 container_name 供 Nginx 連線；runner 只在本 project 的
# default 網路上以 RPC 連 server，不加入 mygo-edge。

name: littleduck-drone

services:
  drone-server:
    image: drone/drone:2.26.0
    # Nginx 以 container_name 解析 upstream，名稱不可與 mygo 的容器重複
    container_name: littleduck-drone-server
    restart: unless-stopped
    env_file: .env
    environment:
      DRONE_SERVER_PROTO: https
      # 只允許 DRONE_USER_FILTER 列出的 GitHub 帳號登入
      DRONE_REGISTRATION_CLOSED: "true"
      DRONE_LOGS_TEXT: "true"
    volumes:
      - drone_data:/data
    networks:
      - default
      - mygo-edge
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  drone-runner:
    image: drone/drone-runner-docker:1.8.4
    container_name: littleduck-drone-runner
    restart: unless-stopped
    depends_on:
      - drone-server
    environment:
      DRONE_RPC_PROTO: http
      DRONE_RPC_HOST: drone-server
      DRONE_RPC_SECRET: ${DRONE_RPC_SECRET:?DRONE_RPC_SECRET 未設定}
      DRONE_RUNNER_NAME: hetzner-cx23
      # 同時只跑一個建置，避免排擠同主機上的 Production
      DRONE_RUNNER_CAPACITY: "1"
    volumes:
      # runner 要用主機的 docker 起建置容器；等同主機 root 權限，見 runbook 的風險說明
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

volumes:
  drone_data:

networks:
  mygo-edge:
    external: true
