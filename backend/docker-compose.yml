# backend/docker-compose.yml
# 本機開發環境：api + PostgreSQL 16，資料以 named volume 持久化

services:
  api:
    build: .
    ports:
      # 主機埠可用 API_PORT 覆寫（預設 8080），本機 8080 被佔用或要並行檢查時使用
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      GIN_MODE: release
      DB_HOST: db
      DB_PORT: "5432"
      DB_USER: littleduck
      DB_PASSWORD: littleduck
      DB_NAME: littleduck
      DB_SSLMODE: disable
      LOG_LEVEL: info
      # 綠界金流：預設為綠界官方文件公開的 stage 測試特店與本機網址（本機收不到綠界真實通知，
      # 因 ReturnURL 對綠界不可達）；Staging／Production 的值由部署 .env 提供，不寫進版控
      ECPAY_MERCHANT_ID: "${ECPAY_MERCHANT_ID:-3002607}"
      ECPAY_HASH_KEY: "${ECPAY_HASH_KEY:-pwFHCqoQZGmho4w6}"
      ECPAY_HASH_IV: "${ECPAY_HASH_IV:-EkRm7iFT261dpevs}"
      ECPAY_ENV: "${ECPAY_ENV:-stage}"
      ECPAY_RETURN_URL: "${ECPAY_RETURN_URL:-http://localhost:8080/api/v1/payments/ecpay/callback}"
      ECPAY_CLIENT_BACK_URL: "${ECPAY_CLIENT_BACK_URL:-http://localhost:3000/sponsor/result}"
      # 後台登入（單一管理員 + JWT）— 本機開發預設值，正式部署請以 deploy 的 .env 覆寫
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin1234}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-me}"
      JWT_TTL: "${JWT_TTL:-24h}"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: littleduck
      POSTGRES_PASSWORD: littleduck
      POSTGRES_DB: littleduck
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U littleduck -d littleduck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
