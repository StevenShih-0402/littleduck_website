openapi: 3.0.3
info:
  title: LittleDuck API — SDP-149 功能開關
  version: 0.1.0
  description: |
    本次新增功能開關的 3 個端點，並在 POST /api/v1/comments 新增 403 回應與選用式管理員權杖（管理員預覽放行）。
    回應一律使用既有統一封包 {code, message, data}。已由後端 Agent 依實作定稿（SDP-149）。
servers:
  - url: http://localhost:8080
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Envelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: SUCCESS
        message:
          type: string
          example: ok
    ErrorEnvelope:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum: [BAD_REQUEST, UNAUTHORIZED, NOT_FOUND, INTERNAL_ERROR, FEATURE_DISABLED]
        message:
          type: string
    FeatureMap:
      type: object
      description: key 為登記表中的開關 key，值為是否啟用
      additionalProperties:
        type: boolean
      example:
        sponsor: true
        guestbook: true
        article_comments: true
    FeatureFlag:
      type: object
      required: [key, name, description, enabled, updated_at]
      properties:
        key:
          type: string
          example: guestbook
        name:
          type: string
          example: 留言板投書
        description:
          type: string
          example: 前台 /guest 的投書表單
        enabled:
          type: boolean
        updated_at:
          type: string
          format: date-time
    FeatureUpdateInput:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
    CommentInput:
      type: object
      required: [name, text]
      properties:
        name:
          type: string
        text:
          type: string
        articleId:
          type: string
          description: 空字串為留言板（受 guestbook 開關控制），否則為文章留言（受 article_comments 開關控制）
paths:
  /api/v1/features:
    get:
      tags: [features]
      summary: 公開讀取功能開關對照表
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FeatureMap"
        "500":
          description: 讀取失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/features:
    get:
      tags: [features]
      summary: 後台列出功能開關（依登記表順序）
      security:
        - BearerAuth: []
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: "#/components/schemas/FeatureFlag"
        "401":
          description: 未帶有效權杖
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: 讀取失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/features/{key}:
    put:
      tags: [features]
      summary: 後台切換單一功能開關
      security:
        - BearerAuth: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
          example: guestbook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeatureUpdateInput"
      responses:
        "200":
          description: 成功，回傳更新後的開關
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/FeatureFlag"
        "400":
          description: body 缺少 enabled 或型別錯誤
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: 未帶有效權杖
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: key 不在登記表
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: 寫入失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/comments:
    post:
      tags: [comments]
      summary: 訪客張貼留言（既有端點；本次新增 403 與選用式管理員權杖）
      description: |
        Authorization 標頭為選用。帶有效管理員 JWT 時不受功能開關限制（管理員預覽）；
        標頭缺失、格式錯誤、權杖無效或過期時視同訪客，不回 401。
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: 建立 pending 留言（既有行為不變）
        "400":
          description: 欄位缺漏（既有行為不變）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: 對應的功能開關停用且非管理員，code 為 FEATURE_DISABLED（本次新增）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: 功能開關讀取失敗（fail-closed，不放行）或寫入失敗
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
